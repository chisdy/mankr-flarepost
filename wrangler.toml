# Mankr Flarepost — single Worker (API + Email Routing handler + SPA assets)
# Deploy: see docs/DEPLOY.md
# One-click: Deploy to Cloudflare button in README (public GitHub/GitLab repo)
#
# After first deploy / one-click:
#   1. Set secrets: COOKIES_SECRET (required), RESEND_API_KEY (if SEND_CHANNEL=resend)
#   2. Set vars: EMAIL_DOMAIN, SEND_CHANNEL (Total Free arbitrary send → "resend")
#   3. Email Routing → catch-all or per-alias → this Worker
#   4. Open /setup to create the admin user
#
# D1: all-zero database_id is a Deploy-to-Cloudflare placeholder.
#     One-click provisions a real D1 and rewrites this ID into the forked repo.

name = "mankr-flarepost"
main = "apps/worker/src/index.ts"
compatibility_date = "2026-07-25"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "mankr-flarepost"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "apps/worker/migrations"

# Cloudflare Email Sending binding (Paid / verified-destination path).
# Total Free arbitrary outbound: use SEND_CHANNEL=resend instead — see docs/DEPLOY.md
[[send_email]]
name = "EMAIL"

[assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
# cloudflare | resend | mailchannels — Total Free arbitrary send: "resend"
SEND_CHANNEL = "cloudflare"
# Your mail domain (aliases become local@EMAIL_DOMAIN)
EMAIL_DOMAIN = "example.com"
