# Mankr Flarepost — single Worker (API + Email Routing handler + SPA assets)
# Deploy: see docs/DEPLOY.md
# One-click: Deploy to Cloudflare button in README (public GitHub/GitLab repo)
#
# After first deploy / one-click:
#   1. Set secrets: COOKIES_SECRET and RESEND_API_KEY (both required)
#   2. Set var EMAIL_DOMAIN in the dashboard (Settings → Variables and Secrets),
#      or in .dev.vars for local dev. It is deliberately not declared here: this
#      is a public repo, and a domain baked into [vars] would follow every fork.
#   3. Email Routing → catch-all or per-alias → this Worker
#   4. Open /setup to create the admin user
#
# D1: all-zero database_id is a Deploy-to-Cloudflare placeholder.
#     One-click provisions a real D1 and rewrites this ID into the forked repo.
#     Deploys never use the placeholder: `pnpm run db:ensure` resolves the real
#     database by name (creating it if missing) into wrangler.deploy.toml, and
#     `pnpm deploy` runs migrations + deploy against that generated config.

name = "mankr-flarepost"
main = "apps/worker/src/index.ts"
compatibility_date = "2026-07-25"
compatibility_flags = ["nodejs_compat"]

# Without this, `wrangler deploy` deletes plain-text vars it cannot see in this
# file — including the dashboard-managed EMAIL_DOMAIN.
keep_vars = true

# Nightly retention purge for deleted / spam mail. Free plan allows cron triggers.
[triggers]
crons = ["0 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "mankr-flarepost"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "apps/worker/migrations"

# No R2 / object storage: enabling R2 requires a payment method on the account,
# which would break the zero-credit-card Total Free path. Inbound attachments are
# not stored — messages surface a "attachments not supported" banner instead.

# No [[send_email]] binding: Cloudflare Email Sending only reaches arbitrary
# recipients on Workers Paid. Outbound goes through Resend (RESEND_API_KEY).

[assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
